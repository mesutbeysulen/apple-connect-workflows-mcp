name: Release
# Publishes to npm and creates the GitHub release whenever main carries a
# package.json version that npm does not have yet. Other pushes do nothing here.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Decide whether this version is new
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run check
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@11.6.2
      # With an NPM_TOKEN secret, OIDC is switched off so npm cannot prefer a trusted-publisher
      # identity the package does not accept; provenance needs OIDC, so it is skipped then.
      # Without the secret, npm publishes through trusted publishing with provenance.
      - if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            ACTIONS_ID_TOKEN_REQUEST_URL= ACTIONS_ID_TOKEN_REQUEST_TOKEN= npm publish --access public
          else
            npm publish --provenance --access public
          fi
      - name: Tag and create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            prerelease=""
            case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
            gh release create "$tag" --verify-tag --generate-notes $prerelease --title "$tag"
          fi
      # Lists this version in the official MCP Registry. GitHub OIDC proves the io.github.mesutbeysulen namespace,
      # so no secret is needed; the registry checks that the npm package's mcpName matches server.json.
      # Decided separately from npm, so a version the registry missed is listed on the next run.
      - name: Decide whether the MCP Registry needs this version
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(node -p "encodeURIComponent(require('./server.json').name)")
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$name/versions/$VERSION")
          if [ "$code" = 200 ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Registry already lists $VERSION."
          elif [ "$code" = 404 ]; then echo "publish=true" >> "$GITHUB_OUTPUT"
          else echo "Registry answered $code"; exit 1; fi
      - name: Wait until npm serves this version
        if: steps.registry.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(node -p "require('./package.json').name")
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "https://registry.npmjs.org/$name/$VERSION"; then exit 0; fi
            sleep 10
          done
          echo "npm does not serve $name@$VERSION after 5 minutes."; exit 1
      - name: Install cosign
        if: steps.registry.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish to the MCP Registry
        if: steps.registry.outputs.publish == 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
