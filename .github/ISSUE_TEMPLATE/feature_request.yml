name: Feature request
description: An App Store Connect task this server cannot do yet.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do
      description: The task in App Store Connect terms, for example "schedule a price change for a subscription in several territories".
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Apple API endpoint, if known
      description: Run `api_catalog_search` in your MCP client to find it, for example `POST /v1/subscriptionPrices`.
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: In App Store Connect, with another tool, or with `api_write_plan`.
